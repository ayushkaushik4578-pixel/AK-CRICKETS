<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gully Cricket - Group Scorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b6e4f;color:#fff;min-height:100vh;padding:16px}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:22px;text-align:center;margin-bottom:16px}
h2{font-size:18px;margin-bottom:12px}
.card{background:#fff;color:#1a2e26;border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{color:#0b6e4f;font-size:15px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:10px}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.btn-primary{background:#12925f;color:#fff}
.btn-secondary{background:#e0e0e0;color:#333}
.btn-danger{background:#e63946;color:#fff}
.btn-run{background:#eefaf3;color:#0b6e4f;border:1px solid #c9ebd9;padding:16px 8px;font-size:18px}
.btn-four{background:#fff3e6;color:#e76f51;border:1px solid #ffd9b3;padding:16px 8px;font-size:18px}
.btn-six{background:#e6f6f4;color:#2a9d8f;border:1px solid #b8e6e0;padding:16px 8px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row{display:flex;justify-content:space-between;padding:10px;background:#f5f5f5;border-radius:8px;margin-bottom:6px;font-size:14px}
.row.active{background:#d1f0e0;font-weight:bold}
.big-score{font-size:32px;font-weight:bold;color:#0b6e4f;text-align:center}
.big-label{text-align:center;color:#666;font-size:13px;margin-bottom:4px}
table{width:100%;font-size:13px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid #eee}
th{background:#0b6e4f;color:#fff}
td:first-child,th:first-child{text-align:left}
.screen{display:none}
.screen.active{display:block}
.msg{background:#ffdd00;color:#333;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-bottom:10px;display:none}
.msg.show{display:block}
.draw-item{display:flex;justify-content:space-between;padding:12px;background:#f5f5f5;border-radius:8px;margin-bottom:8px}
.draw-item:first-child{background:#fff3e6;border:2px solid #f4a261}
.draw-num{background:#0b6e4f;color:#fff;padding:4px 12px;border-radius:20px;font-weight:bold}
.draw-item:first-child .draw-num{background:#f4a261}
.wicket-box{background:#e63946;color:#fff;padding:12px;border-radius:8px;text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">

  <h1>🏏 Gully Cricket Scorer</h1>
  <div class="msg" id="msg"></div>

  <!-- SCREEN 1: SETUP -->
  <div class="screen active" id="setup-screen">
    <div class="card">
      <h2>New Match</h2>
      <h3>Number of players</h3>
      <select id="player-count">
        <option value="2">2 players</option>
        <option value="3">3 players</option>
        <option value="4">4 players</option>
        <option value="5">5 players</option>
        <option value="6" selected>6 players</option>
        <option value="7">7 players</option>
        <option value="8">8 players</option>
      </select>
      <h3>Overs per player</h3>
      <input type="number" id="overs-input" value="2" min="1" max="10">
      <h3>Player names</h3>
      <div id="name-inputs"></div>
      <button class="btn-primary" id="btn-draw">🎲 Draw Batting Order</button>
    </div>
    <button class="btn-secondary" id="btn-history">📜 Match History</button>
  </div>

  <!-- SCREEN 2: DRAW -->
  <div class="screen" id="draw-screen">
    <div class="card">
      <h2>🎲 Batting Order</h2>
      <div id="draw-list"></div>
      <button class="btn-primary" id="btn-start">Start Match →</button>
    </div>
    <button class="btn-secondary" id="btn-back-setup">← Back</button>
  </div>

  <!-- SCREEN 3: LIVE -->
  <div class="screen" id="live-screen">
    <div class="card">
      <div class="big-label">NOW BATTING</div>
      <div class="big-score" id="live-name">Player 1</div>
      <div class="big-label" style="margin-top:8px" id="live-score">0 (0)</div>
      <div class="big-label" id="live-overs">Over 0.0 / 2</div>
    </div>

    <div class="card">
      <h3>Score Runs</h3>
      <div class="grid">
        <button class="btn-run" data-runs="0">0</button>
        <button class="btn-run" data-runs="1">1</button>
        <button class="btn-run" data-runs="2">2</button>
        <button class="btn-run" data-runs="3">3</button>
      </div>
      <div class="grid-3" style="margin-top:6px">
        <button class="btn-four" data-runs="4">4</button>
        <button class="btn-run" data-extra="wide" style="background:#fffbe6;color:#b8860b;border-color:#ffe9a8">Wide</button>
        <button class="btn-six" data-runs="6">6</button>
      </div>
      <button class="btn-danger" data-extra="out" style="margin-top:6px">OUT 🎯</button>
    </div>

    <div class="card">
      <h3>🏆 Leaderboard</h3>
      <table>
        <thead><tr><th>Player</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
        <tbody id="leaderboard"></tbody>
      </table>
    </div>

    <button class="btn-secondary" id="btn-undo">↩ Undo Last Ball</button>
    <button class="btn-danger" id="btn-end">End Match</button>
  </div>

  <!-- SCREEN 4: RESULT -->
  <div class="screen" id="result-screen">
    <div class="card" style="background:linear-gradient(135deg,#0b6e4f,#12925f);color:#fff">
      <h2 id="result-title" style="text-align:center;margin-bottom:8px">🏆 Winner!</h2>
      <div id="result-sub" style="text-align:center"></div>
    </div>
    <div class="card">
      <h3>Final Scorecard</h3>
      <table>
        <thead><tr><th>#</th><th>Player</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
        <tbody id="result-table"></tbody>
      </table>
    </div>
    <button class="btn-primary" id="btn-share">📤 Share Result</button>
    <button class="btn-secondary" id="btn-new">🔁 New Match</button>
  </div>

  <!-- SCREEN 5: HISTORY -->
  <div class="screen" id="history-screen">
    <div class="card">
      <h2>📜 Match History</h2>
      <div id="history-list"></div>
    </div>
    <button class="btn-secondary" id="btn-back-home">← Back</button>
  </div>

</div>

<script>
var STORAGE_MATCH = 'gcs_match_v4';
var STORAGE_HISTORY = 'gcs_history_v4';

var match = null;
var undoStack = [];

// -------- UTILS --------
function $(id) { return document.getElementById(id); }

function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  var t = $(id);
  if (t) t.classList.add('active');
  window.scrollTo(0, 0);
}

function showMsg(text) {
  var m = $('msg');
  m.textContent = text;
  m.classList.add('show');
  setTimeout(function() { m.classList.remove('show'); }, 2000);
}

function formatOvers(balls) {
  return Math.floor(balls / 6) + '.' + (balls % 6);
}

function calcSR(runs, balls) {
  if (balls === 0) return '0.0';
  return ((runs / balls) * 100).toFixed(1);
}

function save() {
  if (!match) return;
  try { localStorage.setItem(STORAGE_MATCH, JSON.stringify(match)); } catch(e) {}
}

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_MATCH);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function clearSaved() {
  try { localStorage.removeItem(STORAGE_MATCH); } catch(e) {}
}

function saveHistory() {
  try {
    var h = getHistory();
    h.unshift(match);
    while (h.length > 10) h.pop();
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(h));
  } catch(e) {}
}

function getHistory() {
  try {
    var raw = localStorage.getItem(STORAGE_HISTORY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

// -------- SETUP SCREEN --------
function renderNameInputs() {
  var count = parseInt($('player-count').value, 10) || 6;
  var container = $('name-inputs');
  var existing = [];
  var oldInputs = container.querySelectorAll('input');
  for (var i = 0; i < oldInputs.length; i++) existing.push(oldInputs[i].value);
  container.innerHTML = '';
  for (var j = 0; j < count; j++) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Player ' + (j + 1);
    inp.maxLength = 15;
    inp.value = existing[j] || '';
    container.appendChild(inp);
  }
}

// -------- DRAW --------
function drawOrder() {
  var names = [];
  var inputs = $('name-inputs').querySelectorAll('input');
  for (var i = 0; i < inputs.length; i++) {
    var v = inputs[i].value.trim();
    names.push(v || ('Player ' + (i + 1)));
  }

  // duplicate check
  var seen = {};
  for (var k = 0; k < names.length; k++) {
    var key = names[k].toLowerCase();
    if (seen[key]) { showMsg('Names must be different!'); return; }
    seen[key] = true;
  }

  // shuffle numbers 1..N
  var nums = [];
  for (var n = 0; n < names.length; n++) nums.push(n + 1);
  for (var s = nums.length - 1; s > 0; s--) {
    var r = Math.floor(Math.random() * (s + 1));
    var tmp = nums[s]; nums[s] = nums[r]; nums[r] = tmp;
  }

  // build players
  var players = [];
  for (var p = 0; p < names.length; p++) {
    players.push({
      name: names[p],
      drawNum: nums[p],
      runs: 0, balls: 0, fours: 0, sixes: 0, out: false
    });
  }
  players.sort(function(a, b) { return a.drawNum - b.drawNum; });

  match = {
    players: players,
    overs: parseInt($('overs-input').value, 10) || 2,
    currentIndex: 0,
    history: [],
    finished: false,
    status: 'drawing',
    createdAt: new Date().toISOString()
  };

  undoStack = [];
  save();
  renderDraw();
  showScreen('draw-screen');
}

function renderDraw() {
  var list = $('draw-list');
  list.innerHTML = '';
  for (var i = 0; i < match.players.length; i++) {
    var p = match.players[i];
    var d = document.createElement('div');
    d.className = 'draw-item';
    d.innerHTML = '<span>' + p.name + '</span><span class="draw-num">#' + p.drawNum + '</span>';
    list.appendChild(d);
  }
}

// -------- LIVE --------
function startMatch() {
  if (!match) { showMsg('Draw first!'); return; }
  match.status = 'live';
  save();
  renderLive();
  showScreen('live-screen');
}

function resumeMatch() {
  renderLive();
  showScreen('live-screen');
}

function renderLive() {
  if (!match) return;
  var p = match.players[match.currentIndex];
  if (!p) return;

  $('live-name').textContent = p.name;
  $('live-score').textContent = p.runs + ' (' + p.balls + ')';
  $('live-overs').textContent = 'Over ' + formatOvers(p.balls) + ' / ' + match.overs;

  // leaderboard
  var sorted = match.players.slice().map(function(pl, idx) {
    return { p: pl, idx: idx };
  }).sort(function(a, b) {
    if (b.p.runs !== a.p.runs) return b.p.runs - a.p.runs;
    return a.p.balls - b.p.balls;
  });

  var tb = $('leaderboard');
  tb.innerHTML = '';
  for (var i = 0; i < sorted.length; i++) {
    var pl = sorted[i].p;
    var isActive = sorted[i].idx === match.currentIndex;
    var tr = document.createElement('tr');
    if (isActive) tr.style.background = '#d1f0e0';
    tr.innerHTML =
      '<td>' + pl.name + (pl.out ? ' <b style="color:red">(out)</b>' : '') + '</td>' +
      '<td>' + pl.runs + '</td>' +
      '<td>' + pl.balls + '</td>' +
      '<td>' + pl.fours + '</td>' +
      '<td>' + pl.sixes + '</td>' +
      '<td>' + calcSR(pl.runs, pl.balls) + '</td>';
    tb.appendChild(tr);
  }
}

function addRuns(r) {
  if (!match || match.finished || match.status !== 'live') return;
  var p = match.players[match.currentIndex];
  if (!p) return;

  undoStack.push(deepCopy(match));

  p.runs += r;
  p.balls += 1;
  if (r === 4) p.fours += 1;
  if (r === 6) p.sixes += 1;
  match.history.push({ type: 'runs', value: r });

  checkTurnEnd();
}

function addWide() {
  if (!match || match.finished || match.status !== 'live') return;
  var p = match.players[match.currentIndex];
  if (!p) return;

  undoStack.push(deepCopy(match));

  p.runs += 1;
  match.history.push({ type: 'wide' });

  save();
  renderLive();
}

function addOut() {
  if (!match || match.finished || match.status !== 'live') return;
  var p = match.players[match.currentIndex];
  if (!p) return;

  undoStack.push(deepCopy(match));

  p.out = true;
  p.balls += 1;
  match.history.push({ type: 'out' });

  nextPlayer();
}

function checkTurnEnd() {
  var p = match.players[match.currentIndex];
  if (p.balls >= match.overs * 6) {
    nextPlayer();
  } else {
    save();
    renderLive();
  }
}

function nextPlayer() {
  match.currentIndex += 1;
  if (match.currentIndex >= match.players.length) {
    finishMatch();
  } else {
    showMsg('Next: ' + match.players[match.currentIndex].name);
    save();
    renderLive();
  }
}

function finishMatch() {
  match.finished = true;
  match.status = 'finished';
  saveHistory();
  clearSaved();
  renderResult();
  showScreen('result-screen');
}

// -------- UNDO --------
function undo() {
  if (undoStack.length === 0) { showMsg('Nothing to undo'); return; }
  match = undoStack.pop();
  save();
  renderLive();
  showMsg('Undone ↩');
}

// -------- RESULT --------
function renderResult() {
  var sorted = match.players.slice().sort(function(a, b) {
    if (b.runs !== a.runs) return b.runs - a.runs;
    return a.balls - b.balls;
  });

  var winner = sorted[0];
  var tied = sorted.length > 1 && sorted[1].runs === winner.runs && sorted[1].balls === winner.balls;

  $('result-title').textContent = tied ? '🤝 Match Tied!' : '🏆 ' + winner.name + ' Wins!';
  $('result-sub').textContent = tied
    ? 'Both scored ' + winner.runs + ' runs'
    : winner.runs + ' runs off ' + winner.balls + ' balls';

  var tb = $('result-table');
  tb.innerHTML = '';
  for (var i = 0; i < sorted.length; i++) {
    var p = sorted[i];
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (i + 1) + '</td>' +
      '<td>' + p.name + (p.out ? ' <b style="color:red">(out)</b>' : '') + '</td>' +
      '<td>' + p.runs + '</td>' +
      '<td>' + p.balls + '</td>' +
      '<td>' + p.fours + '</td>' +
      '<td>' + p.sixes + '</td>' +
      '<td>' + calcSR(p.runs, p.balls) + '</td>';
    tb.appendChild(tr);
  }
}

function shareResult() {
  var lines = ['🏏 Gully Cricket Result', ''];
  lines.push($('result-title').textContent);
  lines.push($('result-sub').textContent);
  lines.push('');
  lines.push('Final Standings:');

  var sorted = match.players.slice().sort(function(a, b) {
    if (b.runs !== a.runs) return b.runs - a.runs;
    return a.balls - b.balls;
  });

  for (var i = 0; i < sorted.length; i++) {
    var p = sorted[i];
    lines.push((i + 1) + '. ' + p.name + ' - ' + p.runs + ' (' + p.balls + ')');
  }

  var text = lines.join('\n');

  if (navigator.share) {
    navigator.share({ text: text }).catch(function() { copyText(text); });
  } else {
    copyText(text);
  }
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showMsg('Result copied! Paste in WhatsApp');
    }).catch(function() {
      showMsg('Cannot copy');
    });
  } else {
    showMsg('Copy not supported');
  }
}

// -------- HISTORY --------
function renderHistory() {
  var list = $('history-list');
  list.innerHTML = '';
  var h = getHistory();
  if (h.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#999;padding:20px">No matches yet</p>';
    return;
  }
  for (var i = 0; i < h.length; i++) {
    var m = h[i];
    var sorted = m.players.slice().sort(function(a, b) { return b.runs - a.runs; });
    var winner = sorted[0];
    var card = document.createElement('div');
    card.className = 'draw-item';
    card.innerHTML =
      '<div>' +
        '<div style="font-weight:bold">' + winner.name + ' won</div>' +
        '<div style="font-size:12px;color:#666">' + winner.runs + ' runs (' + m.players.length + ' players)</div>' +
      '</div>' +
      '<div class="draw-num">' + new Date(m.createdAt).toLocaleDateString() + '</div>';
    list.appendChild(card);
  }
}

// -------- NEW MATCH --------
function newMatch() {
  match = null;
  undoStack = [];
  clearSaved();
  $('name-inputs').innerHTML = '';
  renderNameInputs();
  showScreen('setup-screen');
}

// -------- INIT --------
function init() {
  console.log('🏏 Gully Group Scorer loaded');

  renderNameInputs();
  $('player-count').onchange = renderNameInputs;

  // Setup buttons
  $('btn-draw').onclick = drawOrder;
  $('btn-history').onclick = function() {
    renderHistory();
    showScreen('history-screen');
  };

  // Draw buttons
  $('btn-start').onclick = startMatch;
  $('btn-back-setup').onclick = function() { showScreen('setup-screen'); };

  // Live buttons
  var runBtns = document.querySelectorAll('[data-runs]');
  for (var i = 0; i < runBtns.length; i++) {
    (function(btn) {
      btn.onclick = function() {
        var val = parseInt(btn.getAttribute('data-runs'), 10);
        if (!isNaN(val)) addRuns(val);
      };
    })(runBtns[i]);
  }

  var extraBtns = document.querySelectorAll('[data-extra]');
  for (var j = 0; j < extraBtns.length; j++) {
    (function(btn) {
      btn.onclick = function() {
        var t = btn.getAttribute('data-extra');
        if (t === 'wide') addWide();
        else if (t === 'out') addOut();
      };
    })(extraBtns[j]);
  }

  $('btn-undo').onclick = undo;
  $('btn-end').onclick = function() {
    if (confirm('End match now?')) finishMatch();
  };

  // Result buttons
  $('btn-share').onclick = shareResult;
  $('btn-new').onclick = newMatch;

  // History buttons
  $('btn-back-home').onclick = function() { showScreen('setup-screen'); };

  // Resume if in-progress
  var saved = load();
  if (saved && !saved.finished) {
    match = saved;
    if (saved.status === 'live') {
      resumeMatch();
      return;
    } else if (saved.status === 'drawing') {
      renderDraw();
      showScreen('draw-screen');
      return;
    }
  }

  showScreen('setup-screen');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
